<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>My Planner</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{
    color-scheme: light;
    --work:#3b82f6;
    --personal:#10b981;
    --todo:#f59e0b;
    --done:#9aa0ab;
    --bg:#f5f6f9;
    --card:#ffffff;
    --text:#1f2430;
    --sub:#8a8f9c;
    --border:#ececf1;
  }
  *{box-sizing:border-box;}
  html, body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    background:#e4e6ec; color:var(--text);
  }
  #appShell{
    max-width:480px; margin:0 auto; background:var(--bg); min-height:100vh; padding-bottom:78px;
    box-shadow:0 0 24px rgba(0,0,0,0.06); position:relative;
  }
  #topHeader{
    position:sticky; top:0; z-index:10; background:var(--card); border-bottom:1px solid var(--border);
    padding:14px 16px 4px;
  }
  #topHeader .title-row{display:flex; align-items:center; justify-content:space-between;}
  #topHeader h1{font-size:18px; margin:0;}
  #topHeader .nav-row{display:flex; align-items:center; justify-content:center; gap:18px; padding:8px 0 4px; font-size:15px; font-weight:600;}
  #topHeader .nav-row button{background:none; border:none; font-size:18px; color:var(--sub); cursor:pointer; padding:4px 10px;}
  #topHeader .today-btn{font-size:12px !important; font-weight:600; border:1px solid var(--border) !important; border-radius:999px; padding:4px 10px !important;}

  .chips{display:flex; gap:8px; padding:10px 16px;}
  .chip{flex:1; text-align:center; padding:8px 0; border-radius:10px; border:1px solid var(--border); background:var(--bg); font-size:13px; font-weight:600; cursor:pointer; color:var(--sub);}
  .chip.active{background:var(--text); color:#fff; border-color:var(--text);}

  .viewtabs{display:flex; gap:8px; padding:0 16px 10px;}
  .viewtabs button{flex:1; padding:7px 0; border-radius:999px; border:1px solid var(--border); background:var(--card); font-size:13px; cursor:pointer; color:var(--sub);}
  .viewtabs button.active{background:#eef2ff; color:var(--work); border-color:var(--work); font-weight:700;}

  main.screen{padding:0 16px 16px;}

  /* mini / month calendar grid */
  .cal-grid{background:var(--card); border-radius:16px; padding:12px; margin:8px 0 14px; border:1px solid var(--border);}
  .cal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;}
  .cal-head .cal-nav-left{display:flex; align-items:center; gap:4px;}
  .cal-head .cal-title{font-size:13px; font-weight:700; color:var(--text);}
  .cal-head .cal-nav-btn{background:none; border:none; font-size:16px; color:var(--sub); cursor:pointer; padding:2px 6px;}
  .cal-head .cal-toggle{background:none; border:none; font-size:12px; color:var(--sub); cursor:pointer; padding:4px 6px;}
  .cal-wd{display:grid; grid-template-columns:repeat(7,1fr); text-align:center; font-size:11px; color:var(--sub); margin-bottom:4px;}
  .cal-days{display:grid; grid-template-columns:repeat(7,1fr); gap:2px;}
  .cal-cell{aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; border-radius:10px; cursor:pointer; font-size:13px; color:var(--text); position:relative;}
  .cal-cell.otherMonth{color:#d0d3da;}
  .cal-cell.selected{background:var(--text); color:#fff;}
  .cal-cell.today:not(.selected){border:1.5px solid var(--text);}
  .cal-dots{display:flex; gap:2px; position:absolute; bottom:3px;}
  .cal-dot{width:5px; height:5px; border-radius:50%;}
  .cal-legend{display:flex; gap:14px; justify-content:center; font-size:11px; color:var(--sub); margin-top:8px;}
  .cal-legend span{display:inline-flex; align-items:center; gap:4px;}
  .legend-dot{width:8px; height:8px; border-radius:50%; display:inline-block;}

  /* cards */
  .quad{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .quad.single{grid-template-columns:1fr;}
  .card{background:var(--card); border-radius:16px; padding:12px; border:1px solid var(--border); min-height:120px;}
  .card .card-head{display:flex; align-items:center; justify-content:space-between; font-size:13px; font-weight:700; margin-bottom:8px;}
  .card .card-head .dot{width:8px; height:8px; border-radius:50%; margin-right:6px;}
  .card .card-head-title{display:flex; align-items:center;}
  .card .more{font-size:11px; color:var(--sub); cursor:pointer;}
  .card .row-item{display:flex; align-items:flex-start; gap:6px; font-size:12.5px; padding:4px 0; border-bottom:1px dashed var(--border);}
  .card .row-item:last-child{border-bottom:none;}
  .card .row-item .rt{color:var(--sub); flex:0 0 auto; font-size:11.5px; padding-top:1px;}
  .card .row-item .rbody{flex:1; min-width:0;}
  .card .row-item .rtitle{flex:1; word-break:break-word;}
  .card .row-item .rmemo{font-size:11px; color:var(--sub); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:1px;}
  .card .row-item.done .rtitle{text-decoration:line-through; color:var(--done);}
  .star-btn{background:none; border:none; cursor:pointer; font-size:14px; line-height:1; padding:0 2px; flex:0 0 auto; color:#d0d3da;}
  .star-btn.important{color:#f5b400;}
  .card .empty-mini{font-size:12px; color:var(--sub); padding:8px 0;}
  .card .card-list{max-height:230px; overflow-y:auto;}
  .cb-mini{width:15px; height:15px; border-radius:50%; border:2px solid var(--todo); flex:0 0 15px; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:9px; color:#fff; margin-top:1px;}
  .cb-mini.checked{background:var(--todo);}

  /* agenda list (schedule tab, day view + list) */
  .day-group{margin-bottom:16px;}
  .day-label{font-size:13px; font-weight:700; color:var(--sub); margin:10px 0 8px;}
  .item{
    background:var(--card); border-radius:14px; padding:11px 13px; margin-bottom:8px;
    display:flex; align-items:flex-start; gap:9px; border:1px solid var(--border);
  }
  .item .bar{width:4px; align-self:stretch; border-radius:4px; flex:0 0 4px;}
  .bar.work{background:var(--work);}
  .bar.personal{background:var(--personal);}
  .bar.todo{background:var(--todo);}
  .item.done{opacity:0.6;}
  .item .body{flex:1; min-width:0;}
  .item .title{font-size:14.5px; font-weight:600; line-height:1.4; word-break:break-word;}
  .item.done .title{text-decoration:line-through; color:var(--done);}
  .item .meta{font-size:11.5px; color:var(--sub); margin-top:3px; display:flex; gap:7px; flex-wrap:wrap; align-items:center;}
  .item .memo-preview{font-size:12px; color:var(--sub); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:3px;}
  .star-btn.big{font-size:18px; padding:0 4px;}
  .tag{font-size:10.5px; padding:2px 6px; border-radius:6px; font-weight:700;}
  .tag.work{background:#e8f0fe; color:var(--work);}
  .tag.personal{background:#e3faf1; color:var(--personal);}
  .tag.todo{background:#fef3e2; color:var(--todo);}
  .gcal-btn{font-size:10.5px; padding:3px 7px; border-radius:7px; border:1px solid var(--border); background:#fff; color:var(--text); text-decoration:none;}
  .checkbox{width:21px; height:21px; border-radius:50%; border:2px solid var(--todo); flex:0 0 21px; margin-top:2px; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:11px; color:#fff;}
  .checkbox.checked{background:var(--todo);}
  .item .edit{border:none; background:var(--bg); border-radius:8px; width:28px; height:28px; font-size:13px; cursor:pointer;}
  .empty{text-align:center; color:var(--sub); font-size:13px; padding:30px 0;}

  /* day timeline */
  .allday-chip{display:inline-block; font-size:12px; padding:5px 9px; border-radius:8px; margin:2px 4px 2px 0;}
  .allday-chip.work{background:#e8f0fe; color:var(--work);}
  .allday-chip.personal{background:#e3faf1; color:var(--personal);}
  .allday-chip.todo{background:#fef3e2; color:var(--todo);}
  .timeline{position:relative; background:var(--card); border-radius:14px; border:1px solid var(--border); margin-top:10px; overflow:hidden;}
  .tl-row{display:flex; border-bottom:1px solid var(--border); min-height:44px;}
  .tl-row:last-child{border-bottom:none;}
  .tl-hour{flex:0 0 52px; font-size:11px; color:var(--sub); padding:4px 6px; text-align:right;}
  .tl-slot{flex:1; position:relative; padding:2px 6px;}
  .tl-event{border-radius:8px; padding:4px 8px; font-size:12px; margin:2px 0; color:#fff;}
  .tl-event.work{background:var(--work);}
  .tl-event.personal{background:var(--personal);}

  /* week view */
  .week-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-top:10px;}
  .week-col{background:var(--card); border-radius:12px; border:1px solid var(--border); padding:6px; min-height:140px;}
  .week-col .wd{font-size:11px; color:var(--sub); text-align:center;}
  .week-col .wdate{font-size:13px; font-weight:700; text-align:center; margin-bottom:4px;}
  .week-col.today .wdate{color:var(--work);}
  .week-chip{font-size:10px; padding:3px 4px; border-radius:6px; margin-bottom:3px; color:#fff; word-break:break-word;}
  .week-chip.work{background:var(--work);}
  .week-chip.personal{background:var(--personal);}
  .week-chip.todo{background:var(--todo);}

  /* bottom nav */
  #bottomNav{
    position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:480px;
    background:var(--card); border-top:1px solid var(--border);
    display:flex; z-index:20; padding-bottom:env(safe-area-inset-bottom);
  }
  #bottomNav button{
    flex:1; background:none; border:none; padding:9px 0 8px; display:flex; flex-direction:column; align-items:center;
    gap:2px; font-size:10.5px; color:var(--sub); cursor:pointer;
  }
  #bottomNav button.active{color:var(--work); font-weight:700;}
  #bottomNav .navicon{font-size:19px;}

  /* sheet / modal */
  .sheet-backdrop{position:fixed; inset:0; background:rgba(0,0,0,0.35); display:none; align-items:flex-end; justify-content:center; z-index:30;}
  .sheet-backdrop.open{display:flex;}
  .sheet{background:#fff; width:100%; max-width:480px; border-radius:18px 18px 0 0; padding:18px 18px 24px; max-height:88vh; overflow-y:auto;}
  .sheet h2{margin:0 0 14px; font-size:17px;}
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:12px; color:var(--sub); margin-bottom:5px;}
  .field input[type=text], .field input[type=date], .field input[type=time], .field textarea{
    width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--border); font-size:15px; background:#fafafa;
  }
  .seg{display:flex; gap:8px;}
  .seg button{flex:1; padding:10px; border-radius:10px; border:1px solid var(--border); background:#fafafa; font-size:14px; cursor:pointer;}
  .seg button.active{background:var(--text); color:#fff; border-color:var(--text);}
  .row2{display:flex; gap:10px;}
  .row2 .field{flex:1;}
  .sheet-actions{display:flex; gap:10px; margin-top:16px;}
  .sheet-actions button{flex:1; padding:13px; border-radius:12px; border:none; font-size:15px; font-weight:600; cursor:pointer;}
  .btn-primary{background:var(--text); color:#fff;}
  .btn-ghost{background:var(--bg); color:var(--text);}
  .btn-danger{background:#fde8e8; color:#c0392b;}
  .settings-note{font-size:12px; color:var(--sub); line-height:1.6; margin-top:10px;}
  .back-btn{background:none; border:none; font-size:18px; color:var(--text); cursor:pointer; padding:4px 8px 4px 0;}
  .add-recurring-btn{width:100%; padding:12px; border-radius:12px; border:1px dashed var(--work); background:#eef2ff; color:var(--work); font-size:14px; font-weight:700; cursor:pointer; margin:10px 0 16px;}
  .settings-link-card{display:flex; align-items:center; justify-content:space-between; background:var(--card); border:1px solid var(--border); border-radius:14px; padding:13px 15px; cursor:pointer; margin-top:14px;}
  .settings-link-card .l-title{font-size:14px; font-weight:700;}
  .settings-link-card .l-sub{font-size:11.5px; color:var(--sub); margin-top:2px;}

  .accordion-section{border:1px solid var(--border); border-radius:14px; margin-bottom:10px; overflow:hidden; background:var(--card);}
  .accordion-header{width:100%; display:flex; align-items:center; justify-content:space-between; background:var(--bg); border:none; padding:12px 14px; font-size:14px; font-weight:700; cursor:pointer; color:var(--text); text-align:left;}
  .accordion-count{font-size:11px; font-weight:700; color:var(--sub); background:var(--card); border:1px solid var(--border); border-radius:999px; padding:1px 7px; margin-left:6px;}
  .accordion-caret{color:var(--sub); font-size:12px;}
  .accordion-body{padding:8px 10px 2px;}
  a{color:inherit;}
</style>
</head>
<body>

<div id="appShell">
<header id="topHeader"></header>
<div class="chips" id="chips"></div>
<div class="viewtabs" id="viewtabs" hidden></div>

<main class="screen" id="screenHome"></main>
<main class="screen" id="screenSchedule" hidden></main>
<main class="screen" id="screenTodo" hidden></main>
<main class="screen" id="screenSettings" hidden></main>
<main class="screen" id="screenRecurring" hidden></main>
</div>

<nav id="bottomNav">
  <button data-tab="home"><span class="navicon">🏠</span><span>홈</span></button>
  <button data-tab="schedule"><span class="navicon">📅</span><span>일정</span></button>
  <button data-tab="todo"><span class="navicon">✅</span><span>할일</span></button>
  <button data-tab="add"><span class="navicon">➕</span><span>추가</span></button>
  <button data-tab="settings"><span class="navicon">⚙️</span><span>설정</span></button>
</nav>

<!-- Add/Edit sheet -->
<div class="sheet-backdrop" id="itemBackdrop">
  <div class="sheet">
    <h2 id="itemSheetTitle">새 항목</h2>

    <div class="field">
      <label>구분</label>
      <div class="seg" id="calSeg">
        <button data-v="work" class="active">회사</button>
        <button data-v="personal">개인</button>
      </div>
    </div>

    <div class="field">
      <label>종류</label>
      <div class="seg" id="typeSeg">
        <button data-v="event" class="active">일정</button>
        <button data-v="todo">할일</button>
      </div>
    </div>

    <div class="field">
      <label>제목</label>
      <input type="text" id="f-title" placeholder="예: 팀 회의 / 보고서 제출">
    </div>

    <div class="row2">
      <div class="field">
        <label>시작일</label>
        <input type="date" id="f-startDate">
      </div>
      <div class="field">
        <label>시작시간 (선택)</label>
        <input type="time" id="f-startTime">
      </div>
    </div>
    <div class="row2">
      <div class="field">
        <label>종료일 (선택)</label>
        <input type="date" id="f-endDate">
      </div>
      <div class="field">
        <label>종료시간 (선택)</label>
        <input type="time" id="f-endTime">
      </div>
    </div>

    <div class="field">
      <label>메모 (선택)</label>
      <textarea id="f-memo" rows="2" placeholder="장소, 링크 등"></textarea>
    </div>
    <div class="sheet-actions">
      <button class="btn-ghost" onclick="closeItemSheet()">취소</button>
      <button class="btn-danger" id="deleteBtn" style="display:none;" onclick="deleteCurrentItem()">삭제</button>
      <button class="btn-primary" onclick="saveItem()">저장</button>
    </div>
  </div>
</div>

<!-- Recurring todo template add/edit sheet -->
<div class="sheet-backdrop" id="recurringBackdrop">
  <div class="sheet">
    <h2 id="recurringSheetTitle">정기 할일 추가</h2>

    <div class="field">
      <label>구분</label>
      <div class="seg" id="rCalSeg">
        <button data-v="work" class="active">회사</button>
        <button data-v="personal">개인</button>
      </div>
    </div>

    <div class="field">
      <label>반복 주기</label>
      <div class="seg" id="rRepeatSeg">
        <button data-v="monthly" class="active">매월</button>
        <button data-v="yearly">매년</button>
      </div>
    </div>

    <div class="field">
      <label>제목</label>
      <input type="text" id="r-title" placeholder="예: 관리비 납부">
    </div>

    <div class="row2">
      <div class="field" id="r-month-field" style="display:none;">
        <label>월</label>
        <input type="text" id="r-month" placeholder="예: 3" inputmode="numeric">
      </div>
      <div class="field">
        <label>일</label>
        <input type="text" id="r-day" placeholder="예: 5" inputmode="numeric">
      </div>
    </div>

    <div class="field">
      <label>메모 (선택)</label>
      <textarea id="r-memo" rows="2" placeholder="참고사항"></textarea>
    </div>
    <div class="settings-note">해당 월(또는 해당 날짜)이 되면 할일 목록에 자동으로 추가돼요. 완료 체크는 항목마다 따로 남아요.</div>

    <div class="sheet-actions">
      <button class="btn-ghost" onclick="closeRecurringSheet()">취소</button>
      <button class="btn-danger" id="rDeleteBtn" style="display:none;" onclick="deleteCurrentRecurring()">삭제</button>
      <button class="btn-primary" onclick="saveRecurringItem()">저장</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'ns_dashboard_items_v2';
const SETTINGS_KEY = 'ns_dashboard_settings_v1';

const DEFAULT_ITEMS = [
  {id:'seed-w1', type:'event', calendar:'work', title:'아이오티웍스 미팅 (구디점)', startDate:'2026-08-03', startTime:'10:30', endDate:'2026-08-03', endTime:'11:30', memo:'Google 캘린더에서 가져옴', done:false},
  {id:'seed-w2', type:'event', calendar:'work', title:'백본팀사무실_관리비납부', startDate:'2026-08-05', startTime:null, endDate:'2026-08-05', endTime:null, memo:'Google 캘린더에서 가져옴', done:false},
  {id:'seed-w3', type:'event', calendar:'work', title:'외주용역정기지급', startDate:'2026-08-05', startTime:null, endDate:'2026-08-05', endTime:null, memo:'Google 캘린더에서 가져옴', done:false},
  {id:'seed-w4', type:'event', calendar:'work', title:'💸 지점수익이체', startDate:'2026-08-05', startTime:null, endDate:'2026-08-05', endTime:null, memo:'Google 캘린더에서 가져옴', done:false},
  {id:'seed-w5', type:'todo', calendar:'work', title:'백본팀 정기미팅 자료 준비', startDate:'2026-08-11', startTime:null, endDate:null, endTime:null, memo:'', done:false},
  {id:'seed-p1', type:'event', calendar:'personal', title:'칼럼_파파님', startDate:'2026-08-03', startTime:null, endDate:'2026-08-03', endTime:null, memo:'Google 캘린더에서 가져옴', done:false},
  {id:'seed-p2', type:'event', calendar:'personal', title:'수영님, 민정님 점심', startDate:'2026-08-04', startTime:'12:00', endDate:'2026-08-04', endTime:'13:00', memo:'Google 캘린더에서 가져옴', done:false},
  {id:'seed-p3', type:'event', calendar:'personal', title:'이엠365', startDate:'2026-08-06', startTime:null, endDate:'2026-08-06', endTime:null, memo:'Google 캘린더에서 가져옴', done:false},
  {id:'seed-p4', type:'event', calendar:'personal', title:'건대점 방문', startDate:'2026-08-06', startTime:'09:00', endDate:'2026-08-06', endTime:'18:00', memo:'Google 캘린더에서 가져옴', done:false},
  {id:'seed-p5', type:'event', calendar:'personal', title:'연세발달(언어)', startDate:'2026-08-06', startTime:'18:00', endDate:'2026-08-06', endTime:'19:00', memo:'Google 캘린더에서 가져옴', done:false},
  {id:'seed-p6', type:'event', calendar:'personal', title:'연세발달(언어)', startDate:'2026-08-07', startTime:'16:20', endDate:'2026-08-07', endTime:'17:10', memo:'Google 캘린더에서 가져옴', done:false},
  {id:'seed-p7', type:'event', calendar:'personal', title:'연세발달(감통)', startDate:'2026-08-07', startTime:'17:10', endDate:'2026-08-07', endTime:'18:00', memo:'Google 캘린더에서 가져옴', done:false},
  {id:'seed-t1', type:'todo', calendar:'personal', title:'NS2709 ~9/7 TV 4950원 채널 20개 해지', startDate:'2026-09-01', startTime:null, endDate:null, endTime:null, memo:'Google 캘린더 할일에서 가져옴', done:false},
];

let items = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
if(items === null){
  items = DEFAULT_ITEMS.map(x=>({...x}));
  localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
}

function pad(n){ return n.toString().padStart(2,'0'); }
function toDateStr(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function todayStr(){ return toDateStr(new Date()); }
function parseDate(s){ return new Date(s+'T00:00:00'); }
function addDays(dateStr, n){ const d=parseDate(dateStr); d.setDate(d.getDate()+n); return toDateStr(d); }
function weekdayKr(dateStr){ return ['일','월','화','수','목','금','토'][parseDate(dateStr).getDay()]; }

function matchesFilter(it){
  if(currentFilter==='all') return true;
  return it.calendar===currentFilter;
}
function isOnDate(it, dateStr){
  const s = it.startDate, e = it.endDate || it.startDate;
  if(!s) return false;
  return dateStr >= s && dateStr <= e;
}
function itemsOnDate(dateStr){
  return items.filter(it=>matchesFilter(it) && isOnDate(it, dateStr));
}
function sortByTime(list){
  return list.slice().sort((a,b)=> (a.startTime||'00:00').localeCompare(b.startTime||'00:00'));
}

function gcalUrl(it){
  const text = encodeURIComponent(it.title);
  let dates;
  if(!it.startTime){
    const start = it.startDate.replace(/-/g,'');
    const end = addDays(it.endDate || it.startDate, 1).replace(/-/g,'');
    dates = start+'/'+end;
  } else {
    const sD = it.startDate, sT = it.startTime;
    const eD = it.endDate || it.startDate;
    const eT = it.endTime || it.startTime;
    const start = new Date(`${sD}T${sT}:00+09:00`);
    let end = new Date(`${eD}T${eT}:00+09:00`);
    if(end <= start) end = new Date(start.getTime()+60*60*1000);
    const fmt = d => d.toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';
    dates = fmt(start)+'/'+fmt(end);
  }
  const details = encodeURIComponent(it.memo||'');
  let url = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${text}&dates=${dates}&details=${details}&ctz=Asia%2FSeoul`;
  const email = it.calendar==='work' ? settings.work : settings.personal;
  if(email) url += `&authuser=${encodeURIComponent(email)}`;
  return url;
}

/* ---------------- Google Calendar 양방향 연동 (개인 계정) ---------------- */
let gAccessToken = null;
let gTokenExpiry = 0;
let gTokenClient = null;

function isGoogleConnected(){ return !!(gAccessToken && Date.now() < gTokenExpiry); }

function ensureTokenClient(){
  if(!settings.clientId) return null;
  if(typeof google === 'undefined' || !google.accounts || !google.accounts.oauth2) return null;
  if(!gTokenClient || gTokenClient.__clientId !== settings.clientId){
    gTokenClient = google.accounts.oauth2.initTokenClient({
      client_id: settings.clientId,
      scope: 'https://www.googleapis.com/auth/calendar',
      callback: (resp)=>{
        if(resp && resp.access_token){
          gAccessToken = resp.access_token;
          gTokenExpiry = Date.now() + (resp.expires_in*1000 - 60000);
          if(currentTab==='settings') renderSettings();
          syncFromGoogle(false);
        }
      },
      error_callback: (err)=>{ console.warn('google auth error', err); }
    });
    gTokenClient.__clientId = settings.clientId;
  }
  return gTokenClient;
}
function connectGoogle(){
  const tc = ensureTokenClient();
  if(!tc){ alert('Google 로그인 준비 중이에요. 잠시 후 다시 시도해주세요.'); return; }
  tc.requestAccessToken({prompt:'consent'});
}
function tryAutoConnect(){
  if(!settings.clientId) return;
  const tc = ensureTokenClient();
  if(!tc) return;
  try{ tc.requestAccessToken({prompt:''}); }catch(e){ /* ignore */ }
}
function disconnectGoogle(){
  gAccessToken = null; gTokenExpiry = 0;
  if(currentTab==='settings') renderSettings();
}

async function gFetch(url, opts){
  opts = opts || {};
  opts.headers = Object.assign({}, opts.headers, {Authorization:'Bearer '+gAccessToken});
  const res = await fetch(url, opts);
  if(!res.ok){ const t = await res.text(); throw new Error('Google API '+res.status+': '+t.slice(0,200)); }
  if(res.status===204) return null;
  return res.json();
}

function googleEventToItem(ev, calendarId){
  const existing = items.find(it=>it.googleEventId===ev.id);
  const allDay = !!ev.start.date;
  return {
    id: existing ? existing.id : uid(),
    type: 'event', calendar: 'personal',
    title: ev.summary || '(제목 없음)',
    startDate: allDay ? ev.start.date : ev.start.dateTime.slice(0,10),
    startTime: allDay ? null : ev.start.dateTime.slice(11,16),
    endDate: allDay ? addDays(ev.end.date, -1) : ev.end.dateTime.slice(0,10),
    endTime: allDay ? null : ev.end.dateTime.slice(11,16),
    memo: ev.location || ev.description || '',
    done: existing ? existing.done : false,
    googleEventId: ev.id, googleCalendarId: calendarId
  };
}

async function syncFromGoogle(manual){
  if(!isGoogleConnected()){ if(manual) alert('먼저 개인 캘린더를 연결해주세요.'); return; }
  try{
    const calList = await gFetch('https://www.googleapis.com/calendar/v3/users/me/calendarList');
    const selectedCals = (calList.items||[]).filter(c=>c.selected);
    const timeMin = new Date(); timeMin.setDate(timeMin.getDate()-14);
    const timeMax = new Date(); timeMax.setDate(timeMax.getDate()+90);
    let fetched = [];
    for(const cal of selectedCals){
      const url = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(cal.id)}/events?singleEvents=true&maxResults=250&orderBy=startTime&timeMin=${encodeURIComponent(timeMin.toISOString())}&timeMax=${encodeURIComponent(timeMax.toISOString())}`;
      const data = await gFetch(url);
      (data.items||[]).forEach(ev=>{
        if(ev.status==='cancelled' || !ev.start) return;
        fetched.push(googleEventToItem(ev, cal.id));
      });
    }
    const fetchedIds = new Set(fetched.map(f=>f.googleEventId));
    // 실제 연동 전 보여줬던 데모 시드 데이터(개인/이벤트, googleEventId 없음)는 실제 데이터로 교체
    items = items.filter(it => !(it.calendar==='personal' && it.type==='event' && !it.googleEventId));
    items = items.filter(it => !(it.googleEventId && !fetchedIds.has(it.googleEventId)));
    fetched.forEach(f=>{
      const idx = items.findIndex(it=>it.googleEventId===f.googleEventId);
      if(idx>=0) items[idx] = f; else items.push(f);
    });
    saveAll();
    renderAll();
    if(manual) alert('동기화 완료 ('+fetched.length+'개 일정, 선택된 캘린더 '+selectedCals.length+'개)');
  }catch(e){
    console.error(e);
    if(manual) alert('동기화 중 오류가 발생했어요: '+e.message);
  }
}

function itemToGoogleEvent(item){
  const ev = {summary:item.title, description:item.memo||''};
  if(item.startTime){
    const eD = item.endDate||item.startDate, eT = item.endTime||item.startTime;
    ev.start = {dateTime:`${item.startDate}T${item.startTime}:00`, timeZone:'Asia/Seoul'};
    ev.end = {dateTime:`${eD}T${eT}:00`, timeZone:'Asia/Seoul'};
  } else {
    ev.start = {date:item.startDate};
    ev.end = {date:addDays(item.endDate||item.startDate,1)};
  }
  return ev;
}
async function pushItemToGoogle(item){
  if(!isGoogleConnected() || item.type!=='event' || item.calendar!=='personal') return;
  const calId = item.googleCalendarId || 'primary';
  const body = itemToGoogleEvent(item);
  try{
    if(item.googleEventId){
      await gFetch(`https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(calId)}/events/${item.googleEventId}`,
        {method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
    } else {
      const created = await gFetch(`https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(calId)}/events`,
        {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
      item.googleEventId = created.id;
      item.googleCalendarId = calId;
      saveAll();
    }
  }catch(e){ console.error('구글 캘린더 등록 실패', e); }
}
async function deleteItemFromGoogle(item){
  if(!isGoogleConnected() || !item.googleEventId) return;
  try{
    await gFetch(`https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(item.googleCalendarId||'primary')}/events/${item.googleEventId}`,
      {method:'DELETE'});
  }catch(e){ console.error('구글 캘린더 삭제 실패', e); }
}

function fmtFullDate(dateStr){
  const d = parseDate(dateStr);
  return `${d.getMonth()+1}월 ${d.getDate()}일 (${weekdayKr(dateStr)})`;
}
function weekRangeLabel(dateStr){
  const start = weekStart(dateStr);
  const end = addDays(start,6);
  const sd = parseDate(start), ed = parseDate(end);
  return `${sd.getMonth()+1}.${sd.getDate()} - ${ed.getMonth()+1}.${ed.getDate()}`;
}
function weekStart(dateStr){
  const d = parseDate(dateStr);
  const wd = d.getDay(); // 0=Sun
  const diff = wd===0 ? -6 : 1-wd; // start Monday
  return addDays(dateStr, diff);
}
function shiftDate(dir){
  if(currentTab==='schedule'){
    if(scheduleView==='day') selectedDate = addDays(selectedDate, dir);
    else if(scheduleView==='week') selectedDate = addDays(selectedDate, dir*7);
    else { const d=parseDate(selectedDate); d.setMonth(d.getMonth()+dir); selectedDate = toDateStr(d); }
  }
  renderAll();
}
function goToday(){
  selectedDate = todayStr();
  renderAll();
}
function shiftMiniMonth(dir){
  const d = parseDate(selectedDate);
  const day = d.getDate();
  d.setDate(1);
  d.setMonth(d.getMonth()+dir);
  const dim = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
  d.setDate(Math.min(day, dim));
  selectedDate = toDateStr(d);
  renderAll();
}

function buildMiniCalendar(allowCollapse){
  const collapsed = allowCollapse && settings.homeCollapsed;
  const wrap = document.createElement('div');
  wrap.className = 'cal-grid';
  const cur = parseDate(selectedDate);
  const year = cur.getFullYear(), month = cur.getMonth();
  const firstOfMonth = new Date(year, month, 1);
  const startOffset = (firstOfMonth.getDay()+6)%7; // Monday=0
  const gridStart = new Date(year, month, 1-startOffset);

  const head = document.createElement('div'); head.className='cal-head';
  const navLeft = document.createElement('div'); navLeft.className='cal-nav-left';
  const prevBtn = document.createElement('button'); prevBtn.className='cal-nav-btn'; prevBtn.textContent='‹';
  prevBtn.onclick = ()=> shiftMiniMonth(-1);
  const titleSpan = document.createElement('span'); titleSpan.className='cal-title';
  titleSpan.textContent = year+'년 '+(month+1)+'월';
  const nextBtn = document.createElement('button'); nextBtn.className='cal-nav-btn'; nextBtn.textContent='›';
  nextBtn.onclick = ()=> shiftMiniMonth(1);
  navLeft.appendChild(prevBtn); navLeft.appendChild(titleSpan); navLeft.appendChild(nextBtn);
  head.appendChild(navLeft);
  if(allowCollapse){
    const toggle = document.createElement('button'); toggle.className='cal-toggle';
    toggle.textContent = collapsed ? '펼치기 ▾' : '접기 ▴';
    toggle.onclick = ()=>{ settings.homeCollapsed = !settings.homeCollapsed; saveSettingsToStorage(); renderAll(); };
    head.appendChild(toggle);
  }
  wrap.appendChild(head);

  const wdRow = document.createElement('div'); wdRow.className='cal-wd';
  ['월','화','수','목','금','토','일'].forEach(w=>{ const s=document.createElement('div'); s.textContent=w; wdRow.appendChild(s); });
  wrap.appendChild(wdRow);

  // pick which day-cells to render: full 42-cell grid, or just the single
  // week row that contains selectedDate when the mini calendar is collapsed
  let startIdx = 0, count = 42;
  if(collapsed){
    const selIdx = Math.round((parseDate(selectedDate) - gridStart) / 86400000);
    const weekIdx = Math.floor(selIdx/7);
    startIdx = weekIdx*7; count = 7;
  }

  const daysEl = document.createElement('div'); daysEl.className='cal-days';
  for(let i=startIdx;i<startIdx+count;i++){
    const d = new Date(gridStart); d.setDate(gridStart.getDate()+i);
    const dStr = toDateStr(d);
    const cell = document.createElement('div');
    cell.className = 'cal-cell';
    if(d.getMonth()!==month) cell.classList.add('otherMonth');
    if(dStr===todayStr()) cell.classList.add('today');
    if(dStr===selectedDate) cell.classList.add('selected');
    cell.onclick = ()=>{ selectedDate = dStr; renderAll(); };

    const num = document.createElement('div'); num.textContent = d.getDate();
    cell.appendChild(num);

    const dayItems = items.filter(it=> isOnDate(it, dStr));
    const dots = document.createElement('div'); dots.className='cal-dots';
    const hasWork = dayItems.some(it=>it.calendar==='work' && it.type==='event');
    const hasPersonal = dayItems.some(it=>it.calendar==='personal' && it.type==='event');
    const hasTodo = dayItems.some(it=>it.type==='todo');
    if(hasWork){ const dot=document.createElement('span'); dot.className='cal-dot'; dot.style.background='var(--work)'; dots.appendChild(dot); }
    if(hasPersonal){ const dot=document.createElement('span'); dot.className='cal-dot'; dot.style.background='var(--personal)'; dots.appendChild(dot); }
    if(hasTodo){ const dot=document.createElement('span'); dot.className='cal-dot'; dot.style.background='var(--todo)'; dots.appendChild(dot); }
    cell.appendChild(dots);

    daysEl.appendChild(cell);
  }
  wrap.appendChild(daysEl);

  if(!collapsed){
    const legend = document.createElement('div'); legend.className='cal-legend';
    legend.innerHTML = `
      <span><span class="legend-dot" style="background:var(--work)"></span>회사 일정</span>
      <span><span class="legend-dot" style="background:var(--personal)"></span>개인 일정</span>
      <span><span class="legend-dot" style="background:var(--todo)"></span>할일</span>`;
    wrap.appendChild(legend);
  }
  return wrap;
}

function buildCard(cal, type, title, emoji){

    list = list.sort((a,b)=> (a.startDate+ (a.startTime||'00:00')).localeCompare(b.startDate+(b.startTime||'00:00')));
  } else {
    list = list.sort((a,b)=> (a.done?1:0)-(b.done?1:0) || ((b.important?1:0)-(a.important?1:0)));

      const cb = document.createElement('div'); cb.className='cb-mini'+(it.done?' checked':'');
      cb.textContent = it.done?'✓':'';
      cb.onclick=(e)=>{ e.stopPropagation(); it.done=!it.done; saveAll(); renderAll(); };
      row.appendChild(cb);
    } else {
      const t = document.createElement('span'); t.className='rt';
      t.textContent = it.startTime ? it.startTime : fmtFullDate(it.startDate);
      row.appendChild(t);
    }
    const body = document.createElement('span'); body.className='rbody';

    if(it.memo){ const rm=document.createElement('div'); rm.className='rmemo'; rm.textContent=it.memo; body.appendChild(rm); }
    row.appendChild(body);

      star.textContent = it.important?'★':'☆';
      star.onclick=(e)=>{ e.stopPropagation(); it.important=!it.important; saveAll(); renderAll(); };
      row.appendChild(star);
    }
    row.onclick = ()=> openItemSheet(it.id);
    listWrap.appendChild(row);
  });
  return card;

    dayItems.forEach(it=>{
      const chip = document.createElement('div');
      chip.className = 'week-chip ' + (it.type==='todo'?'todo':it.calendar);
      chip.textContent = it.title;
      chip.onclick = ()=> openItemSheet(it.id);
      col.appendChild(chip);
    });
    col.onclick = (e)=>{ if(e.target===col){ selectedDate=dStr; scheduleView='day'; renderAll(); } };
    grid.appendChild(col);
  }
  wrap.appendChild(grid);
  return wrap;
}

function buildMonthView(){
  const wrap = document.createElement('div');
  wrap.appendChild(buildMiniCalendar(false));
  const dayItems = sortByTime(itemsOnDate(selectedDate));
  const label = document.createElement('div'); label.className='day-label'; label.textContent = fmtFullDate(selectedDate);
  wrap.appendChild(label);
  if(dayItems.length===0){
    const e=document.createElement('div'); e.className='empty'; e.textContent='이 날은 일정/할일이 없어요.';
    wrap.appendChild(e);
  }
  dayItems.forEach(it=> wrap.appendChild(renderItemRow(it)));
  return wrap;
}

function renderTodo(){
  const el = document.getElementById('screenTodo');
  el.innerHTML = '';
  const groups = [];
  if(currentFilter!=='personal') groups.push(['work','회사 할일']);
  if(currentFilter!=='work') groups.push(['personal','개인 할일']);

  groups.forEach(([cal,label])=>{
    const g = document.createElement('div'); g.className='day-group';
    const h = document.createElement('div'); h.className='day-label'; h.textContent = label;
    g.appendChild(h);
    let list = items.filter(it=>it.type==='todo' && it.calendar===cal);
    list = list.sort((a,b)=> (a.done?1:0)-(b.done?1:0) || ((b.important?1:0)-(a.important?1:0)) || (a.startDate||'9999').localeCompare(b.startDate||'9999'));
    if(list.length===0){
      const e=document.createElement('div'); e.className='empty'; e.textContent='할일이 없어요.';
      g.appendChild(e);

  });

/* ---------------- shared item row (used in month agenda + todo tab) ---------------- */
function renderItemRow(it){
  const row = document.createElement('div');
  row.className = 'item' + (it.done?' done':'');
  const bar = document.createElement('div'); bar.className='bar '+(it.type==='todo'?'todo':it.calendar);
  row.appendChild(bar);

  if(it.type==='todo'){
    const cb = document.createElement('div'); cb.className='checkbox'+(it.done?' checked':'');
    cb.textContent = it.done?'✓':'';
    cb.onclick = ()=>{ it.done=!it.done; saveAll(); renderAll(); };
    row.appendChild(cb);
  }

  const body = document.createElement('div'); body.className='body';
  const title = document.createElement('div'); title.className='title'; title.textContent = it.title;
  body.appendChild(title);

  const meta = document.createElement('div'); meta.className='meta';
  const tag = document.createElement('span');
  tag.className = 'tag ' + (it.type==='todo'?'todo':it.calendar);
  tag.textContent = it.type==='todo' ? (it.calendar==='work'?'회사 할일':'개인 할일') : (it.calendar==='work'?'회사':'개인');
  meta.appendChild(tag);
  if(it.startTime){ const t=document.createElement('span'); t.textContent=it.startTime; meta.appendChild(t); }
  else if(it.type==='event'){ const t=document.createElement('span'); t.textContent='종일'; meta.appendChild(t); }
  if(it.startDate && it.type==='todo'){ const t=document.createElement('span'); t.textContent=fmtFullDate(it.startDate); meta.appendChild(t); }
  if(it.type==='event'){
    const a = document.createElement('a'); a.className='gcal-btn'; a.textContent='G캘린더에 추가'; a.target='_blank'; a.rel='noopener';
    a.href = gcalUrl(it);
    meta.appendChild(a);
  }
  body.appendChild(meta);
  if(it.memo){ const m=document.createElement('div'); m.className='memo-preview'; m.textContent=it.memo; body.appendChild(m); }
  row.appendChild(body);

  if(it.type==='todo'){
    const star = document.createElement('button'); star.className='star-btn big'+(it.important?' important':'');
    star.textContent = it.important?'★':'☆';
    star.onclick = ()=>{ it.important=!it.important; saveAll(); renderAll(); };
    row.appendChild(star);
  }

  const edit = document.createElement('button'); edit.className='edit'; edit.textContent='✎';
  edit.onclick = ()=> openItemSheet(it.id);
  row.appendChild(edit);
  return row;
}

/* ---------------- RECURRING TODOS ---------------- */
function daysInMonth(y,m){ return new Date(y, m, 0).getDate(); } // m: 1-12
function ensureRecurringInstances(){
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth()+1;
  let changed = false;
  recurringTemplates.filter(t=>t.active).forEach(t=>{
    if(t.repeat==='yearly' && t.month !== m) return;
    const dim = daysInMonth(y, m);
    const day = Math.min(t.day, dim);
    const dateStr = y+'-'+pad(m)+'-'+pad(day);
    const period = t.repeat==='monthly' ? (y+'-'+pad(m)) : (''+y);
    const exists = items.some(it=>it.recurringId===t.id && it.recurringPeriod===period);
    if(!exists){
      items.push({id:uid(), type:'todo', calendar:t.calendar, title:t.title, startDate:dateStr, startTime:null,
        endDate:null, endTime:null, memo:t.memo||'', done:false, important:false,
        recurringId:t.id, recurringPeriod:period});
      changed = true;
    }
  });
  if(changed) saveAll();
}

let editingRecurringId = null;
let r_cal = 'work';
let r_repeat = 'monthly';

function openRecurringSheet(id){
  editingRecurringId = id || null;
  document.getElementById('recurringSheetTitle').textContent = id ? '정기 할일 수정' : '정기 할일 추가';
  document.getElementById('rDeleteBtn').style.display = id ? 'block':'none';
  if(id){
    const t = recurringTemplates.find(x=>x.id===id);
    r_cal = t.calendar; r_repeat = t.repeat;
    document.getElementById('r-title').value = t.title;
    document.getElementById('r-day').value = t.day;
    document.getElementById('r-month').value = t.month || '';
    document.getElementById('r-memo').value = t.memo || '';
  } else {
    r_cal = 'work'; r_repeat = 'monthly';
    document.getElementById('r-title').value = '';
    document.getElementById('r-day').value = '';
    document.getElementById('r-month').value = '';
    document.getElementById('r-memo').value = '';
  }
  updateRCalSegUI(); updateRRepeatSegUI();
  document.getElementById('recurringBackdrop').classList.add('open');
}
function closeRecurringSheet(){ document.getElementById('recurringBackdrop').classList.remove('open'); }

document.getElementById('rCalSeg').addEventListener('click', e=>{
  const btn = e.target.closest('button'); if(!btn) return;
  r_cal = btn.dataset.v; updateRCalSegUI();
});
function updateRCalSegUI(){ [...document.getElementById('rCalSeg').children].forEach(b=>b.classList.toggle('active', b.dataset.v===r_cal)); }

document.getElementById('rRepeatSeg').addEventListener('click', e=>{
  const btn = e.target.closest('button'); if(!btn) return;
  r_repeat = btn.dataset.v; updateRRepeatSegUI();
});
function updateRRepeatSegUI(){
  [...document.getElementById('rRepeatSeg').children].forEach(b=>b.classList.toggle('active', b.dataset.v===r_repeat));
  document.getElementById('r-month-field').style.display = r_repeat==='yearly' ? 'block' : 'none';
}

function saveRecurringItem(){
  const title = document.getElementById('r-title').value.trim();
  const day = parseInt(document.getElementById('r-day').value, 10);
  const month = r_repeat==='yearly' ? parseInt(document.getElementById('r-month').value, 10) : null;
  const memo = document.getElementById('r-memo').value.trim();
  if(!title){ alert('제목을 입력해주세요'); return; }
  if(!day || day<1 || day>31){ alert('날짜(일)를 1~31 사이로 입력해주세요'); return; }
  if(r_repeat==='yearly' && (!month || month<1 || month>12)){ alert('월을 1~12 사이로 입력해주세요'); return; }

  if(editingRecurringId){
    const t = recurringTemplates.find(x=>x.id===editingRecurringId);
    t.title=title; t.calendar=r_cal; t.repeat=r_repeat; t.day=day; t.month=month; t.memo=memo;
  } else {
    recurringTemplates.push({id:uid(), title, calendar:r_cal, repeat:r_repeat, day, month, memo, active:true});
  }
  persistRecurring();
  ensureRecurringInstances();
  closeRecurringSheet();
  renderAll();
}
function deleteCurrentRecurring(){
  if(!editingRecurringId) return;
  recurringTemplates = recurringTemplates.filter(x=>x.id!==editingRecurringId);
  persistRecurring();
  closeRecurringSheet();
  renderAll();
}
function toggleRecurringActive(id){
  const t = recurringTemplates.find(x=>x.id===id);
  if(!t) return;
  t.active = !t.active;
  persistRecurring();
  if(t.active) ensureRecurringInstances();
  renderAll();
}

let recurringOpenSections = { work_monthly:true, work_yearly:false, personal_monthly:true, personal_yearly:false };

function renderRecurringPage(){
  const el = document.getElementById('screenRecurring');
  el.innerHTML = '';

  const note = document.createElement('div'); note.className='settings-note';
  note.textContent = '여기 등록해두면 매월(또는 매년) 해당 날짜가 되었을 때 할일 목록에 자동으로 채워져요. 아래에서 구분·주기별로 펼쳐서 전체 목록을 확인할 수 있어요.';
  el.appendChild(note);

  const addBtn = document.createElement('button'); addBtn.className='add-recurring-btn';
  addBtn.textContent = '+ 정기 할일 추가';
  addBtn.onclick = ()=> openRecurringSheet(null);
  el.appendChild(addBtn);

  const groups = [
    ['work','monthly','🔵 회사 · 매월'],
    ['work','yearly','🔵 회사 · 매년'],
    ['personal','monthly','🟢 개인 · 매월'],
    ['personal','yearly','🟢 개인 · 매년'],
  ];

  groups.forEach(([cal,repeat,label])=>{
    const key = cal+'_'+repeat;
    const list = recurringTemplates.filter(t=>t.calendar===cal && t.repeat===repeat);
    const open = recurringOpenSections[key];

    const section = document.createElement('div'); section.className='accordion-section';
    const header = document.createElement('button'); header.className='accordion-header';
    header.innerHTML = `<span>${label}<span class="accordion-count">${list.length}</span></span><span class="accordion-caret">${open ? '▾' : '▸'}</span>`;
    header.onclick = ()=>{ recurringOpenSections[key] = !recurringOpenSections[key]; renderRecurringPage(); };
    section.appendChild(header);

    if(open){
      const body = document.createElement('div'); body.className='accordion-body';
      if(list.length===0){
        const e = document.createElement('div'); e.className='empty-mini'; e.textContent='등록된 항목이 없어요.';
        body.appendChild(e);
      } else {
        list.forEach(t=> body.appendChild(buildRecurringRow(t)));
      }
      section.appendChild(body);
    }
    el.appendChild(section);
  });
}

function buildRecurringRow(t){
  const row = document.createElement('div'); row.className='item'+(t.active?'':' done');
  const bar = document.createElement('div'); bar.className='bar '+t.calendar;
  row.appendChild(bar);

  const body = document.createElement('div'); body.className='body';
  const title = document.createElement('div'); title.className='title'; title.textContent=t.title;
  body.appendChild(title);
  const meta = document.createElement('div'); meta.className='meta';
  const freq = document.createElement('span');
  freq.textContent = t.repeat==='monthly' ? ('매월 '+t.day+'일') : ('매년 '+t.month+'월 '+t.day+'일');
  meta.appendChild(freq);
  if(!t.active){ const s=document.createElement('span'); s.textContent='꺼짐'; meta.appendChild(s); }
  body.appendChild(meta);
  if(t.memo){ const m=document.createElement('div'); m.className='memo-preview'; m.textContent=t.memo; body.appendChild(m); }
  row.appendChild(body);

  const toggleBtn = document.createElement('button'); toggleBtn.className='edit';
  toggleBtn.textContent = t.active ? '⏸' : '▶';
  toggleBtn.onclick = ()=> toggleRecurringActive(t.id);
  row.appendChild(toggleBtn);

  const edit = document.createElement('button'); edit.className='edit'; edit.textContent='✎';
  edit.onclick = ()=> openRecurringSheet(t.id);
  row.appendChild(edit);

  return row;
}

/* ---------------- item add/edit sheet ---------------- */
function openItemSheet(id){
  editingId = id || null;
  document.getElementById('itemSheetTitle').textContent = id ? '항목 수정' : '새 항목';
  document.getElementById('deleteBtn').style.display = id ? 'block':'none';

  if(id){
    const it = items.find(x=>x.id===id);
    f_cal = it.calendar; f_type = it.type;
    document.getElementById('f-title').value = it.title;
    document.getElementById('f-startDate').value = it.startDate || '';
    document.getElementById('f-startTime').value = it.startTime || '';
    document.getElementById('f-endDate').value = it.endDate || '';
    document.getElementById('f-endTime').value = it.endTime || '';
    document.getElementById('f-memo').value = it.memo || '';
  } else {
    f_cal = currentFilter==='personal' ? 'personal' : 'work';
    f_type = 'event';
    document.getElementById('f-title').value = '';
    document.getElementById('f-startDate').value = selectedDate;
    document.getElementById('f-startTime').value = '';
    document.getElementById('f-endDate').value = '';
    document.getElementById('f-endTime').value = '';
    document.getElementById('f-memo').value = '';

  document.getElementById('itemBackdrop').classList.add('open');
}
function closeItemSheet(){ document.getElementById('itemBackdrop').classList.remove('open'); }

document.getElementById('calSeg').addEventListener('click', e=>{
  const btn = e.target.closest('button'); if(!btn) return;
  f_cal = btn.dataset.v; updateCalSegUI();
});
function updateCalSegUI(){ [...document.getElementById('calSeg').children].forEach(b=>b.classList.toggle('active', b.dataset.v===f_cal)); }

document.getElementById('typeSeg').addEventListener('click', e=>{
  const btn = e.target.closest('button'); if(!btn) return;
  f_type = btn.dataset.v; updateTypeSegUI();
});
function updateTypeSegUI(){ [...document.getElementById('typeSeg').children].forEach(b=>b.classList.toggle('active', b.dataset.v===f_type)); }

function saveItem(){
  const title = document.getElementById('f-title').value.trim();
  if(!title){ alert('제목을 입력해주세요'); return; }
  const startDate = document.getElementById('f-startDate').value || null;
  const startTime = document.getElementById('f-startTime').value || null;
  const endDate = document.getElementById('f-endDate').value || startDate;
  const endTime = document.getElementById('f-endTime').value || null;
  const memo = document.getElementById('f-memo').value.trim();

  let savedItem;
  if(editingId){
    const it = items.find(x=>x.id===editingId);
    it.title=title; it.calendar=f_cal; it.type=f_type;
    it.startDate=startDate; it.startTime=startTime; it.endDate=endDate; it.endTime=endTime; it.memo=memo;
    savedItem = it;
  } else {
    savedItem = {id:uid(), type:f_type, calendar:f_cal, title, startDate, startTime, endDate, endTime, memo, done:false, important:false};
    items.push(savedItem);
  }
  saveAll();
  closeItemSheet();
  renderAll();
  pushItemToGoogle(savedItem);
}
function deleteCurrentItem(){
  if(!editingId) return;
  const it = items.find(x=>x.id===editingId);
  if(it) deleteItemFromGoogle(it);
  items = items.filter(x=>x.id!==editingId);
  saveAll();
  closeItemSheet();
  renderAll();
}

/* ---------------- bottom nav ---------------- */
document.getElementById('bottomNav').addEventListener('click', e=>{
  const btn = e.target.closest('button'); if(!btn) return;
  const tab = btn.dataset.tab;
  if(tab==='add'){ openItemSheet(null); return; }
  currentTab = tab;
  renderAll();
});

/* ---------------- master render ---------------- */
function renderAll(){
  renderHeader();
  renderChips();
  renderViewTabs();

  document.getElementById('screenHome').hidden = currentTab!=='home';
  document.getElementById('screenSchedule').hidden = currentTab!=='schedule';
  document.getElementById('screenTodo').hidden = currentTab!=='todo';
  document.getElementById('screenSettings').hidden = currentTab!=='settings';
  document.getElementById('screenRecurring').hidden = currentTab!=='recurring';
  document.getElementById('chips').hidden = (currentTab==='settings' || currentTab==='recurring');

  if(currentTab==='home') renderHome();
  else if(currentTab==='schedule') renderSchedule();
  else if(currentTab==='todo') renderTodo();
  else if(currentTab==='settings') renderSettings();
  else if(currentTab==='recurring') renderRecurringPage();

  const navTab = currentTab==='recurring' ? 'settings' : currentTab;
  [...document.getElementById('bottomNav').children].forEach(b=>{
    b.classList.toggle('active', b.dataset.tab===navTab);
  });
}

ensureRecurringInstances();
renderAll();
